services:
  redis:
    image: redis:7-alpine
    # No `ports:` here on purpose: the heliosphere service reaches this
    # container over the internal compose network at redis:6379, so nothing
    # needs it published to the host. Redis has no auth configured, and a
    # published port binds 0.0.0.0 by default - do NOT add one back unless
    # you also bind it to localhost (e.g. "127.0.0.1:6379:6379") for a
    # redis-cli debugging session.
    volumes:
      - redis-data:/data

  heliosphere:
    build: .
    ports:
      - "8000:8000"
    environment:
      HELIOSPHERE_REDIS_URL: redis://redis:6379/0
      HELIOSPHERE_DUCKDB_PATH: /app/data/heliosphere.duckdb
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

volumes:
  redis-data:
